# Decap CMS configuration. The GitHub login URL is set automatically in public/admin/index.html. See README > CMS.
backend:
  name: github
  repo: Ravi1145/tripti-maam-
  branch: main

# When running `npm run dev` + `npm run cms` locally, the admin edits files on disk with no login.
local_backend: true

site_url: https://www.example.com
display_url: https://www.example.com
logo_url: /admin/logo.svg
publish_mode: simple
media_folder: public/uploads
public_folder: /uploads
locale: en

collections:
  # --------------------------------------------------------------- ARTICLES
  - name: articles
    label: Articles
    label_singular: Article
    folder: content/articles
    extension: md
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{date}}"
    sortable_fields: [date, title]
    fields:
      - { label: Title (best as a question from everyday life), name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: Short summary (cards and Google, 140-160 characters), name: excerpt, widget: text }
      - label: Topic
        name: ability
        widget: select
        options:
          - { label: Communication and language, value: communication-and-language }
          - { label: Thinking and problem-solving, value: thinking-and-problem-solving }
          - { label: Relationships and participation, value: relationships-and-participation }
          - { label: Attention and persistence, value: attention-and-persistence }
          - { label: Early reading, writing and maths, value: early-reading-writing-and-maths }
          - { label: Big ideas, value: big-ideas }
      - label: Ages this article is for
        name: ages
        widget: select
        multiple: true
        required: false
        options:
          - { label: Birth to 12 months, value: birth-to-12-months }
          - { label: 1 to 2 years, value: 1-to-2 }
          - { label: 2 to 3 years, value: 2-to-3 }
          - { label: 3 to 4 years, value: 3-to-4 }
          - { label: 4 to 5 years, value: 4-to-5 }
          - { label: 5 to 6 years, value: 5-to-6 }
          - { label: 6 to 7 years, value: 6-to-7 }
          - { label: 7 to 8 years, value: 7-to-8 }
      - { label: Tags, name: tags, widget: list, required: false, default: [] }
      - { label: Author, name: author, widget: string, default: Tripta Tarunesh }
      - { label: Approved by Tripta (turns off the "Draft" ribbon), name: reviewed, widget: boolean, default: false }
      - { label: Hide from website (draft), name: draft, widget: boolean, default: false }
      - { label: SEO title (optional), name: seoTitle, widget: string, required: false }
      - { label: SEO description (optional), name: seoDescription, widget: text, required: false }
      - { label: Body, name: body, widget: markdown, hint: "Use headings: A familiar moment, One thing to try, What to notice, Further reading." }

  # ------------------------------------------------------------ AGE GUIDES
  - name: ages
    label: Age guides and Today's Play
    files:
      - name: ages
        label: The eight age guides
        file: content/ages.json
        format: json
        fields:
          - { label: Approved by Tripta (turns off the "Draft" ribbon), name: reviewed, widget: boolean, default: false }
          - label: Guides
            name: items
            widget: list
            summary: "{{fields.label}}: {{fields.title}}"
            fields:
              - { label: Web address part (do not change), name: slug, widget: string }
              - { label: Age label, name: label, widget: string }
              - { label: Short line, name: short, widget: string }
              - { label: Colour, name: stage, widget: select, options: [coral, sun, mint, violet, sky, saffron] }
              - { label: Title, name: title, widget: string }
              - { label: A familiar moment, name: moment, widget: text }
              - { label: "Try this today: title", name: tryTitle, widget: string }
              - { label: "Try this today: what to do (also used by Today's Play)", name: tryText, widget: text }
              - { label: What to look for next, name: lookText, widget: text }
              - { label: Share what you notice, name: shareText, widget: text }
              - { label: Article to read next (article file name without .md), name: article, widget: string }

  # ---------------------------------------------------------- SELF-CHECK
  - name: selfcheck
    label: School self-check
    files:
      - name: selfcheck
        label: Self-check questions
        file: content/selfcheck.json
        format: json
        fields:
          - { label: Approved by Tripta (turns off the "Draft" ribbon), name: reviewed, widget: boolean, default: false }
          - { label: Title, name: title, widget: string }
          - { label: Introduction, name: intro, widget: text }
          - { label: Answer choices (4, from lowest to highest), name: scale, widget: list, field: { label: Choice, name: c, widget: string } }
          - label: Areas
            name: areas
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { label: Key (do not change), name: key, widget: string }
              - { label: Label, name: label, widget: string }
              - { label: Colour, name: tint, widget: select, options: [coral, sun, mint, violet, sky, saffron] }
              - { label: Advice shown when this is the area to start with, name: advice, widget: text }
          - label: Questions
            name: questions
            widget: list
            summary: "{{fields.text}}"
            fields:
              - { label: Area key (relationships, play, language, thinking, seeing), name: area, widget: string }
              - { label: Statement, name: text, widget: text }

  # ---------------------------------------------------------------- EVENTS
  - name: events
    label: Events and gallery
    label_singular: Event
    folder: content/events
    extension: md
    create: true
    slug: "{{slug}}"
    summary: "{{title}} - {{date}}"
    fields:
      - { label: Event name, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD", required: false }
      - { label: Location, name: location, widget: string, required: false }
      - { label: Summary, name: summary, widget: text }
      - { label: Cover image, name: cover, widget: image, required: false }
      - label: Photos
        name: photos
        widget: list
        required: false
        summary: "{{fields.caption}}"
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Caption (also used as alt text), name: caption, widget: string, required: false }
      - { label: Hide from website (draft), name: draft, widget: boolean, default: false }
      - { label: Details, name: body, widget: markdown, required: false }

  # ------------------------------------------------------------------- FAQ
  - name: faq
    label: Questions (FAQ)
    files:
      - name: faq
        label: Frequently asked questions
        file: content/faq.json
        format: json
        fields:
          - label: Questions
            name: items
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

  # --------------------------------------------------- SITE TEXT & SETTINGS
  - name: site
    label: Site text and settings
    files:
      - name: profile
        label: All website text
        file: data/profile.json
        format: json
        fields:
          - label: Site (Google)
            name: site
            widget: object
            fields:
              - { label: Live website URL (no trailing slash), name: url, widget: string }
              - { label: Browser/Google title, name: title, widget: string }
              - { label: Google description, name: description, widget: text }
          - label: About me (details)
            name: person
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Role, name: role, widget: string }
              - { label: Location, name: location, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: Email (shown on Contact when filled in), name: email, widget: string }
              - { label: Phone (shown on Contact when filled in), name: phone, widget: string }
          - label: Home page
            name: home
            widget: object
            fields:
              - { label: Small heading, name: eyebrow, widget: string }
              - { label: Headline (first part), name: headlineStart, widget: string }
              - { label: Headline (highlighted part), name: headlineHighlight, widget: string }
              - { label: Introduction, name: sub, widget: text }
              - label: Four facts under the buttons
                name: trust
                widget: list
                summary: "{{fields.value}} {{fields.label}}"
                fields: [{ label: Big text, name: value, widget: string }, { label: Label, name: label, widget: string }]
              - label: Dark band
                name: band
                widget: object
                fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text }]
              - label: Four pillars
                name: pillars
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: string }
                  - { label: Colour, name: tint, widget: select, options: [coral, sun, sky, violet, mint, saffron] }
                  - { label: Icon, name: icon, widget: select, options: [heart, blocks, chat, bulb, book, users, eye, compass, star] }
          - label: About page
            name: about
            widget: object
            fields:
              - { label: Introduction, name: intro, widget: text }
              - { label: My story (last paragraph is shown as a large quote), name: story, widget: list, field: { label: Paragraph, name: p, widget: text } }
              - { label: What I keep learning, name: learning, widget: list, field: { label: Item, name: i, widget: string } }
              - { label: Recognition, name: recognition, widget: list, field: { label: Award, name: r, widget: string } }
              - { label: At a glance, name: facts, widget: list, field: { label: Fact, name: f, widget: string } }
              - { label: Who I work with, name: workWith, widget: text }
          - label: Work with schools page
            name: schools
            widget: object
            fields:
              - { label: Introduction, name: intro, widget: text }
              - label: Offers (keep four, they pair with four photos)
                name: offers
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Colour, name: tint, widget: select, options: [violet, coral, sky, sun, mint, saffron] }
                  - { label: Icon, name: icon, widget: select, options: [book, users, eye, blocks, heart, chat, bulb, compass, star] }
                  - { label: Text, name: text, widget: text }
                  - { label: Includes, name: items, widget: list, field: { label: Item, name: i, widget: string } }
              - label: Three steps
                name: process
                widget: list
                summary: "{{fields.title}}"
                fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: text }]
              - { label: Enquiry invitation, name: cta, widget: text }
          - label: PlayXploration page
            name: playx
            widget: object
            fields:
              - { label: Tagline, name: tagline, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - label: Two lenses
                name: lenses
                widget: list
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Text, name: text, widget: text }
                  - { label: Colour, name: tint, widget: select, options: [coral, violet, sky, sun, mint, saffron] }
              - { label: What play makes visible, name: visible, widget: list, field: { label: Item, name: i, widget: string } }
              - { label: At the intersection of, name: intersections, widget: list, field: { label: Item, name: i, widget: string } }
          - label: Foundation Years First
            name: fyf
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: By line, name: by, widget: string }
              - { label: Launch line, name: launched, widget: string }
              - { label: Premise, name: premise, widget: string }
              - { label: Tagline, name: tagline, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - { label: Aims, name: goals, widget: list, field: { label: Aim, name: g, widget: string } }
          - label: Anubhuti (monthly letter)
            name: newsletter
            widget: object
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Introduction, name: intro, widget: text }
              - { label: The first letter, name: letter, widget: text }
              - { label: Newsletter platform link, name: link, widget: string }
          - label: Speaking page
            name: speaking
            widget: object
            fields:
              - { label: Topics, name: topics, widget: list, field: { label: Topic, name: t, widget: string } }
              - label: Events
                name: events
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Where, name: where, widget: string }
                  - { label: When, name: when, widget: string }
                  - { label: Text, name: text, widget: text }
              - label: Certifications
                name: certifications
                widget: list
                summary: "{{fields.title}}"
                fields: [{ label: Title, name: title, widget: string }, { label: Organisation, name: org, widget: string }]
          - { label: How we write (paragraphs, in order), name: howWeWrite, widget: list, field: { label: Paragraph, name: p, widget: text } }
          - label: Contact page
            name: contact
            widget: object
            fields:
              - { label: Introduction, name: intro, widget: text }
              - label: What happens next (three steps)
                name: next
                widget: list
                summary: "{{fields.title}}"
                fields: [{ label: Title, name: title, widget: string }, { label: Text, name: text, widget: string }]
          - { label: Outstanding to-do list (not shown to visitors), name: todo, widget: list, required: false, field: { label: Item, name: i, widget: string } }
